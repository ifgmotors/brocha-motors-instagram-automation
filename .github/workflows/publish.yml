name: Publicar Reels de Brocha Motors

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: instagram-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Publicar si hay un Reel pendiente
        env:
          META_API_VERSION: v24.0
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PUBLIC_MEDIA_BASE: ${{ secrets.PUBLIC_MEDIA_BASE }}
        run: node publish.mjs
      - name: Guardar registro antirepetición
        run: |
          if git diff --quiet -- state.json; then exit 0; fi
          git config user.name "brocha-motors-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git commit -m "Registrar Reel publicado"
          git push
